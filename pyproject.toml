[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homemate-asset-workshop"
version = "0.4.0"
description = "Local texture editing, XX model candidates and reversible patches for HomeMate"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10,<13", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["playwright>=1.40,<2", "build>=1,<2"]

[project.scripts]
homemate-workshop = "homemate_workshop.__main__:main"

[tool.setuptools.packages.find]
include = ["homemate_workshop*"]

[tool.setuptools.package-data]
homemate_workshop = ["web/**/*", "assets/*", "comfyui/*.json", "comfyui/*.md", "comfyui/*.py"]
