name: Build Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_portable.py
      - name: Check frozen runtime
        run: |
          @'
          import json, os, pathlib, subprocess
          exe = next(pathlib.Path('dist').glob('HomeMateWorkshop-*/素材工坊.exe')).resolve()
          data = pathlib.Path('workspace/ci-runtime').resolve()
          env = dict(os.environ)
          for key in ['PYTHONHOME', 'PYTHONPATH', 'VIRTUAL_ENV', 'TCL_LIBRARY', 'TK_LIBRARY']:
              env.pop(key, None)
          env['PATH'] = str(pathlib.Path(env['SystemRoot']) / 'System32')
          subprocess.run([str(exe), '--diagnostics', '--data-dir', str(data)], env=env, check=True, timeout=30)
          result = json.loads((data / 'diagnostics.json').read_text(encoding='utf-8'))
          assert result['frozen'] and result['required_files_present'], result
          print(result)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*-windows-x64-portable.zip
            dist/*-windows-x64-portable.zip.sha256
